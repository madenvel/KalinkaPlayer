[global]
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = SMB2_02
   smb ports = 445
   log level = 1
   load printers = no
   printing = bsd
   disable spoolss = yes
   printcap name = /dev/null

[music]
   path = /music
   valid users = kalinka
   read only = yes
   force user = root

[public]
   path = /music
   guest ok = yes
   read only = yes
   force user = root
