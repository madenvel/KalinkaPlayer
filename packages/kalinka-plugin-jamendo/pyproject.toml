[build-system]
requires = ["setuptools>=68", "wheel", "build", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-jamendo"
dynamic = ["version"]
description = "Jamendo plugin for Kalinka Music Player"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Dmitry Savin", email = "envelsavinds@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # >=1.2: ai_search encodes queries with the server's shared text
    # embedder (context.embedder), added in SDK 1.2.
    "kalinka-plugin-sdk>=2,<3",
    "httpx>=0.24",
    # ai_search (mood/semantic): sqlite-vec KNN over the shipped index.
    # Imported lazily; ai_search disables itself if these are unavailable.
    "numpy>=1.24",
    "sqlite-vec>=0.1",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "kalinka-plugin-dev>=1.0,<2",
    "pytest",
    "pytest-asyncio",
    "setuptools-scm",
]

[project.entry-points."kalinka.plugins"]
kalinka_plugin_jamendo = "kalinka_plugin_jamendo:KalinkaPluginJamendo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/kalinka_plugin_jamendo/_version.py"
tag_regex = "^kalinka-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match kalinka-v*"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"
search_parent_directories = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "smoke: smoke tests for basic functionality",
    "integration: integration tests",
]
