[build-system]
requires = ["setuptools>=68", "wheel", "build", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-localfiles"
dynamic = ["version"]
description = "Local files plugin for Kalinka Music Player"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Dmitry Savin", email = "envelsavinds@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "kalinka-plugin-sdk>=3,<4",
    "rapidfuzz>=2.0.0",
    "musicbrainzngs>=0.7.1",
    "inotify_simple>=1.3.5",
    "requests>=2.28.0",
    "mutagen>=1.46.0",
    "sqlite-vec>=0.1.6,<0.2",
    "ftfy>=6.0",
    # CRF runtime for the bundled filename parser; imports as "pycrfsuite".
    # Pinned exactly, not ranged: filename_model/weights/model.crfsuite was
    # written by this CRFsuite version, and a format change in a later one
    # would degrade the output silently rather than fail.
    "python-crfsuite==0.9.12",
]

[project.optional-dependencies]
dev = [
    "kalinka-plugin-dev>=1.0,<2",
    "pytest",
    "setuptools-scm",
]

[project.entry-points."kalinka.plugins"]
kalinka_plugin_localfiles = "kalinka_plugin_localfiles:KalinkaPluginLocalFiles"

[tool.setuptools]
# Deliberately left on: setuptools_scm's file finder reports every git-tracked
# file under src/, which is how procedural_artwork/README.md reaches the wheel.
include-package-data = true

[tool.setuptools.package-data]
# Belt to that finder's braces — a build from an exported tarball has no git
# and would otherwise ship a wheel with no model in it.
"kalinka_plugin_localfiles.filename_model.weights" = ["*.crfsuite", "*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/kalinka_plugin_localfiles/_version.py"
tag_regex = "^kalinka-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match kalinka-v*"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"
search_parent_directories = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "smoke: smoke tests for basic functionality",
    "integration: integration tests",
]

[tool.black]
# Copied verbatim from kalinka-training; reformatting it would break the
# per-file hashes that prove it is unmodified.
extend-exclude = "src/kalinka_plugin_localfiles/filename_model/_vendor/"

[tool.mypy]
exclude = "src/kalinka_plugin_localfiles/filename_model/_vendor/"

[[tool.mypy.overrides]]
module = "pycrfsuite.*"
ignore_missing_imports = true
