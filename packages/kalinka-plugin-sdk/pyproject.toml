[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-sdk"
# Version is the single source of truth in src/kalinka_plugin_sdk/_version.py
# (__version__). See [tool.setuptools.dynamic] below. Bump the major there only
# for a breaking API change (and then the consumers' >=1,<2 bounds).
dynamic = ["version"]
description = "Kalinka Plugin SDK for developing input modules and device plugins"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Dmitry Savin", email = "envelsavinds@gmail.com"}
]
maintainers = [
    {name = "Dmitry Savin", email = "envelsavinds@gmail.com"}
]
keywords = ["audio", "player", "plugin", "sdk", "kalinka"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/madenvel/KalinkaPlayer"
Repository = "https://github.com/madenvel/KalinkaPlayer"
Issues = "https://github.com/madenvel/KalinkaPlayer/issues"
Documentation = "https://github.com/madenvel/KalinkaPlayer/blob/main/README.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["kalinka_plugin_sdk*"]
exclude = ["tests*", "*.tests", "*.tests.*", "tests.*"]

[tool.setuptools.dynamic]
version = {attr = "kalinka_plugin_sdk._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
