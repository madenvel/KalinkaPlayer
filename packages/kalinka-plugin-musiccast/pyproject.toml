[build-system]
requires = ["setuptools>=68", "wheel", "build", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-musiccast"
dynamic = ["version"]
description = "A plugin for Kalinka to support Yamaha MusicCast device for volume control and automatic power on / off and input switch"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Dmitry Savin", email = "envelsavinds@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # >=2: nothing here names a track's source, but REQUIRES_SDK gates the
    # major at load; the VolumeBackend the amplifier reports arrived in 1.5.
    "kalinka-plugin-sdk>=2,<3",
    "ssdpy>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "kalinka-plugin-dev>=1.0,<2",
    "pytest",
    "pytest-asyncio>=0.20.0",
    "setuptools-scm",
]

[project.entry-points."kalinka.plugins"]
kalinka_plugin_musiccast = "kalinka_plugin_musiccast:KalinkaPluginMusiccast"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/kalinka_plugin_musiccast/_version.py"
tag_regex = "^kalinka-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match kalinka-v*"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"
search_parent_directories = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "smoke: smoke tests for basic functionality",
    "integration: integration tests",
    "unit: unit tests",
]