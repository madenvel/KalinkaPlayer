name: Release

# Builds the app-bundle .deb packages and publishes them to the GitHub release
# for a `kalinka-v*` tag.
#
# - Triggered automatically when a `kalinka-v*` tag is pushed, or manually
#   (workflow_dispatch) against an already-existing tag — handy for publishing a
#   release that was cut by hand.
# - Every bundle package — server, plugins, SDK — is pure Python and
#   Architecture: all, so one job builds the whole bundle and the same
#   artifacts install on any distro and arch. (The platform-specific
#   kalinka-renderer has its own release train: renderer-release.yml.)
#
# See RELEASING.md for the versioning model (one tag versions the whole bundle).

on:
  push:
    tags:
      - 'kalinka-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing kalinka-v* tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (all)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make git ca-certificates dpkg-dev \
            python3 python3-pip python3-venv
          # build/setuptools-scm for wheel builds; pydantic is needed
          # by the localfiles plugin's build-time optional_packages export.
          # --ignore-installed: these deps pull a newer `packaging` than the
          # dpkg-installed one, which pip cannot uninstall (no RECORD file).
          pip install --upgrade --ignore-installed build setuptools-scm pydantic

      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # full history + tags so setuptools_scm sees the tag

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Not build-all-deb: that also builds the renderer, which needs a C++
      # toolchain this container has no reason to carry and belongs to
      # renderer-release.yml anyway — its packages are per-arch, and this job
      # runs on one.
      - name: Build .deb packages
        run: make kalinka-server-deb kalinka-plugins-deb copy-debs

      - name: Collect artifacts
        run: |
          mkdir -p out
          find debs -name '*.deb' -exec cp -n {} out/ \;
          echo "Built packages:"
          ls -l out/
          echo "--- server Depends (sanity) ---"
          for d in out/kalinka-server_*.deb; do
            [ -f "$d" ] && { echo "$d:"; dpkg-deb -f "$d" Depends; }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-all
          path: out/*.deb
          if-no-files-found: error

  # Same bundle as one noarch RPM for Fedora (built in the fc45 container so
  # the dist tag is right; contents are arch- and release-independent).
  rpm:
    name: Build (rpm)
    runs-on: ubuntu-24.04
    # Not fedora:45 — that tag is rawhide, and its Python runs ahead of the
    # wheels the build needs: pydantic-core has no cp315 build, so pip falls
    # back to compiling it from source and wants a Rust and C toolchain this
    # job has no business carrying. A released Fedora has wheels.
    container:
      image: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y make git rpm-build python3-pip systemd-rpm-macros
          pip install --upgrade build setuptools-scm pydantic

      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # full history + tags so setuptools_scm sees the tag

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM
        run: cd packages/kalinka-server && ./scripts/build_rpm.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms-all
          path: packages/kalinka-server/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, rpm]
    runs-on: ubuntu-24.04
    steps:
      # Full history + tags: the notes step lists commits since the previous
      # kalinka-v* tag (GitHub's --generate-notes only lists merged PRs, and
      # most commits here land on main directly — it came out empty).
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather packages and checksums
        run: |
          mkdir -p release
          find artifacts \( -name '*.deb' -o -name '*.rpm' \) -exec cp -n {} release/ \;
          (cd release && sha256sum ./* > SHA256SUMS)
          echo "Release assets:"
          ls -l release/
          cat release/SHA256SUMS

      - name: Create / update release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#kalinka-v}"
          echo "Publishing $TAG"

          # Install instructions go above the auto-generated changelog so the
          # release page leads with what a user should actually do.
          cat > notes.md <<EOF
          ## Install / upgrade

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install-release.sh | sudo bash -s -- $VERSION
          \`\`\`

          Downloads this release's packages and installs them with \`apt\` (drop the \`-s -- $VERSION\` to always get the latest release instead). All bundle packages are arch-independent (\`_all.deb\`) — the same artifacts install on any machine. It also pulls the browser player (\`kalinka-web\`) from the [app repo's latest release](https://github.com/madenvel/KalinkaAI/releases) — once installed, open \`http://<server-ip>:8000\` in any browser on your network to control playback — and the renderer that plays the audio, on this same machine.

          **Manual install:** download all the \`_all.deb\` packages, then run \`sudo apt install ./*.deb\` in the download directory. Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`. For the browser player, add \`kalinka-web_*_all.deb\` from the [app releases](https://github.com/madenvel/KalinkaAI/releases). A manual install installs no renderer, so that server has no audio output until you add one.

          **Renderers on other machines** run their own installer, which picks the package for that box:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install-renderer.sh | sudo bash
          \`\`\`

          The renderer versions separately — see the [latest \`kalinka-renderer-v*\` release](https://github.com/$GITHUB_REPOSITORY/releases?q=kalinka-renderer-v&expanded=true).
          EOF

          # Commit list since the previous kalinka-v* tag (skipped for the
          # first release ever). Folded away: a release can carry eighty
          # commit subjects, and a wall of them buries the install
          # instructions above it. Highlights worth reading are written by
          # hand afterwards — `gh release edit "$TAG" --notes-file`.
          PREV=$(git tag -l 'kalinka-v*' --sort=-v:refname | sed -n "/^${TAG}\$/{n;p}")
          if [ -n "$PREV" ]; then
            {
              echo
              echo "<details>"
              echo "<summary>Full commit log since ${PREV#kalinka-v}</summary>"
              echo
              git log --no-merges --pretty='* %s — %h' "$PREV..$TAG"
              echo
              echo "</details>"
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            } >> notes.md
          fi

          # Create the release if it doesn't exist yet (idempotent: re-runs and
          # builds for a hand-cut release just fall through to upload).
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Kalinka $VERSION" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          # Pin this release as "latest" so /releases/latest (linked from the
          # website's download buttons) always resolves to a kalinka-v* software
          # release, never a newer data release (jamendo-ai-*, clap-onnx-*).
          # Unconditional so hand-cut pre-existing releases get pinned too.
          gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"
